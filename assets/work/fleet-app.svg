<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mob-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#EAE6DC"/>
    </linearGradient>
    <filter id="phone-shadow" x="-10%" y="-5%" width="125%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#141312" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#mob-bg)"/>

  <!-- Tech Dots Pattern -->
  <pattern id="dot-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="1.5" fill="#141312" fill-opacity="0.05"/>
  </pattern>
  <rect width="800" height="500" fill="url(#dot-grid)"/>

  <!-- Left: Metric Highlight Card Floating -->
  <g transform="translate(70, 90)" filter="url(#phone-shadow)">
    <rect width="250" height="150" rx="16" fill="#FFFFFF" stroke="#141312" stroke-opacity="0.08"/>
    <rect x="20" y="20" width="80" height="22" rx="11" fill="#E7F8F0"/>
    <text x="32" y="35" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#0DA868">4.9 ★ RATING</text>
    
    <text x="20" y="70" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#7E7A73">ACTIVE FLEET USERS</text>
    <text x="20" y="104" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="800" fill="#141312">25,400+</text>
    <text x="20" y="128" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#0DA868">✓ 45% QA &amp; Dev Cost Saved</text>
  </g>

  <!-- Left Bottom: Architecture Card -->
  <g transform="translate(70, 265)" filter="url(#phone-shadow)">
    <rect width="250" height="155" rx="16" fill="#FFFFFF" stroke="#141312" stroke-opacity="0.08"/>
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#141312">UNIFIED FLUTTER ENGINE</text>
    
    <rect x="20" y="48" width="210" height="28" rx="6" fill="#F7F5F0"/>
    <text x="30" y="66" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4E4B46">Single Codebase (iOS &amp; Android)</text>
    
    <rect x="20" y="84" width="210" height="28" rx="6" fill="#F7F5F0"/>
    <text x="30" y="102" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4E4B46">Clean Architecture / BLoC</text>

    <rect x="20" y="120" width="210" height="22" rx="6" fill="#FDF0EB"/>
    <text x="30" y="135" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#EE5A2A">Sub-second GPS Telemetry</text>
  </g>

  <!-- Center-Right: Mobile Device Mockup (Fleet App Interface) -->
  <g transform="translate(360, 45)" filter="url(#phone-shadow)">
    <!-- Device Body -->
    <rect width="220" height="420" rx="36" fill="#141312" stroke="#4E4B46" stroke-width="2"/>
    <!-- Screen Glass -->
    <rect x="8" y="8" width="204" height="404" rx="28" fill="#FBF9F5"/>
    
    <!-- Dynamic Island / Speaker -->
    <rect x="74" y="16" width="72" height="18" rx="9" fill="#141312"/>
    <circle cx="134" cy="25" r="3.5" fill="#242220"/>

    <!-- Map UI Background -->
    <g transform="translate(8, 44)">
      <rect width="204" height="240" fill="#E8ECE9"/>
      
      <!-- Roads on Map -->
      <path d="M 0 60 Q 60 40 120 90 T 204 110" stroke="#FFFFFF" stroke-width="8" fill="none"/>
      <path d="M 40 0 L 70 240" stroke="#FFFFFF" stroke-width="6" fill="none"/>
      <path d="M 140 0 L 170 240" stroke="#FFFFFF" stroke-width="6" fill="none"/>
      <path d="M 0 160 Q 100 140 204 180" stroke="#FFFFFF" stroke-width="6" fill="none"/>

      <!-- Live GPS Navigation Route (Coral Accent) -->
      <path d="M 45 40 Q 90 70 120 120 T 155 190" stroke="#EE5A2A" stroke-width="4" stroke-linecap="round" fill="none"/>
      
      <!-- Origin Pin -->
      <circle cx="45" cy="40" r="5" fill="#141312"/>
      
      <!-- Fleet Moving Vehicle Pin -->
      <g transform="translate(120, 120)">
        <circle cx="0" cy="0" r="14" fill="#EE5A2A" fill-opacity="0.2"/>
        <circle cx="0" cy="0" r="7" fill="#EE5A2A"/>
        <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
      </g>

      <!-- Destination Marker -->
      <circle cx="155" cy="190" r="6" fill="#0DA868"/>
    </g>

    <!-- Bottom Sheet / Fleet Driver Telemetry -->
    <g transform="translate(16, 260)">
      <rect width="188" height="140" rx="16" fill="#FFFFFF" filter="url(#phone-shadow)"/>
      
      <!-- Drag handle -->
      <rect x="80" y="8" width="28" height="3" rx="1.5" fill="#A8A49D"/>

      <text x="14" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#141312">Fleet Transit #4092</text>
      <rect x="130" y="16" width="46" height="16" rx="8" fill="#E7F8F0"/>
      <text x="137" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#0DA868">LIVE</text>

      <text x="14" y="48" font-family="-apple-system, sans-serif" font-size="9" fill="#7E7A73">ETA to Hub: 14 mins (4.2 km)</text>
      
      <!-- Progress Bar -->
      <rect x="14" y="58" width="160" height="4" rx="2" fill="#EFECE3"/>
      <rect x="14" y="58" width="115" height="4" rx="2" fill="#EE5A2A"/>

      <rect x="14" y="72" width="76" height="24" rx="6" fill="#F7F5F0"/>
      <text x="22" y="88" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#141312">Speed: 42 km/h</text>

      <rect x="98" y="72" width="76" height="24" rx="6" fill="#F7F5F0"/>
      <text x="106" y="88" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#141312">Battery: 94%</text>

      <rect x="14" y="104" width="160" height="26" rx="8" fill="#141312"/>
      <text x="50" y="121" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Dispatch Action →</text>
    </g>
  </g>

  <!-- Far Right: Secondary Device / Consumer App -->
  <g transform="translate(605, 75)" filter="url(#phone-shadow)" opacity="0.85">
    <rect width="140" height="360" rx="24" fill="#FFFFFF" stroke="#141312" stroke-opacity="0.08"/>
    <rect x="12" y="18" width="116" height="40" rx="10" fill="#FAF8F5"/>
    <text x="20" y="36" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#141312">Consumer View</text>
    <text x="20" y="48" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#0DA868">Driver Approaching</text>
    
    <rect x="12" y="70" width="116" height="160" rx="10" fill="#E8ECE9"/>
    <circle cx="70" cy="150" r="10" fill="#EE5A2A" fill-opacity="0.3"/>
    <circle cx="70" cy="150" r="4" fill="#EE5A2A"/>

    <rect x="12" y="242" width="116" height="100" rx="10" fill="#FAF8F5"/>
    <text x="20" y="264" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#141312">One-Tap Booking</text>
    <rect x="20" y="276" width="100" height="20" rx="6" fill="#141312"/>
    <text x="36" y="290" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#FFFFFF">Book Ride →</text>
  </g>
</svg>
