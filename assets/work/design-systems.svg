<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ds-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5F0"/>
      <stop offset="100%" stop-color="#EBE7DE"/>
    </linearGradient>
    <filter id="ds-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#141312" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#ds-bg)"/>

  <!-- Canvas Dot Pattern -->
  <pattern id="canvas-dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1" fill="#141312" fill-opacity="0.08"/>
  </pattern>
  <rect width="800" height="500" fill="url(#canvas-dots)"/>

  <g transform="translate(60, 45)" filter="url(#ds-shadow)">
    <rect width="680" height="410" rx="16" fill="#FFFFFF" stroke="#141312" stroke-opacity="0.08" stroke-width="1.5"/>

    <!-- Header -->
    <rect width="680" height="46" rx="16" fill="#FAF8F5"/>
    <path d="M 0 46 L 680 46" stroke="#141312" stroke-opacity="0.08" stroke-width="1"/>
    
    <circle cx="28" cy="23" r="5" fill="#EE5A2A"/>
    <circle cx="44" cy="23" r="5" fill="#D6F75A" stroke="#141312" stroke-opacity="0.2"/>
    <circle cx="60" cy="23" r="5" fill="#0DA868"/>
    
    <text x="85" y="27" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#141312">Design System Studio · Real-time Token Canvas</text>

    <!-- Right Badge -->
    <rect x="510" y="12" width="144" height="22" rx="6" fill="#E7F8F0" stroke="#0DA868" stroke-opacity="0.4"/>
    <text x="522" y="26" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#0DA868">✓ 50% FASTER HANDOFF</text>

    <!-- Interactive Component Palette -->
    <!-- Left Panel: Design Tokens -->
    <g transform="translate(24, 66)">
      <rect width="180" height="320" rx="10" fill="#FAF8F5" stroke="#141312" stroke-opacity="0.06"/>
      <text x="16" y="26" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#141312">Color &amp; Type Tokens</text>
      
      <!-- Token 1 -->
      <rect x="16" y="42" width="24" height="24" rx="6" fill="#EE5A2A"/>
      <text x="48" y="54" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#141312">brand-coral</text>
      <text x="48" y="64" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#7E7A73">#EE5A2A · 100%</text>

      <!-- Token 2 -->
      <rect x="16" y="76" width="24" height="24" rx="6" fill="#D6F75A" stroke="#141312" stroke-opacity="0.2"/>
      <text x="48" y="88" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#141312">lime-accent</text>
      <text x="48" y="98" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#7E7A73">#D6F75A · 100%</text>

      <!-- Token 3 -->
      <rect x="16" y="110" width="24" height="24" rx="6" fill="#141312"/>
      <text x="48" y="122" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#141312">deep-ink</text>
      <text x="48" y="132" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#7E7A73">#141312 · 100%</text>

      <!-- Typography scale -->
      <path d="M 16 150 L 164 150" stroke="#141312" stroke-opacity="0.06"/>
      <text x="16" y="174" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#7E7A73">TYPE SCALE</text>
      <text x="16" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#141312">Heading H1</text>
      <text x="16" y="218" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#4E4B46">Body Regular / 15px</text>
      <text x="16" y="238" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7E7A73">mono-code-12</text>

      <rect x="16" y="260" width="148" height="42" rx="8" fill="#FDF0EB" stroke="#F9CAB8"/>
      <text x="26" y="278" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#EE5A2A">GITHUB ACTIONS SYNC</text>
      <text x="26" y="292" font-family="-apple-system, sans-serif" font-size="9" fill="#4E4B46">Auto-PR on Token Change</text>
    </g>

    <!-- Center Canvas: Component UI Sandbox -->
    <g transform="translate(220, 66)">
      <rect width="436" height="320" rx="10" fill="#FAF8F5" stroke="#141312" stroke-opacity="0.06"/>
      
      <!-- Component Card 1: Interactive Buttons & Badges -->
      <g transform="translate(24, 20)">
        <rect width="388" height="135" rx="10" fill="#FFFFFF" stroke="#141312" stroke-opacity="0.06"/>
        <text x="16" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#141312">Buttons &amp; Interactive States</text>
        
        <!-- Primary Button -->
        <rect x="16" y="42" width="110" height="34" rx="8" fill="#141312"/>
        <text x="32" y="63" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Primary Action</text>

        <!-- Secondary Button -->
        <rect x="136" y="42" width="110" height="34" rx="8" fill="#FFFFFF" stroke="#141312" stroke-opacity="0.15"/>
        <text x="156" y="63" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#141312">Secondary</text>

        <!-- Coral Accent Button -->
        <rect x="256" y="42" width="116" height="34" rx="8" fill="#EE5A2A"/>
        <text x="274" y="63" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Start Project →</text>

        <!-- Badges Row -->
        <rect x="16" y="90" width="70" height="20" rx="10" fill="#E7F8F0"/>
        <text x="26" y="104" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#0DA868">DEPLOYED</text>

        <rect x="96" y="90" width="60" height="20" rx="10" fill="#FDF0EB"/>
        <text x="106" y="104" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#EE5A2A">STAGING</text>

        <rect x="166" y="90" width="84" height="20" rx="10" fill="#F3F0E8"/>
        <text x="176" y="104" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#4E4B46">FIGMA SYNC</text>
      </g>

      <!-- Component Card 2: Live Code Preview -->
      <g transform="translate(24, 175)">
        <rect width="388" height="125" rx="10" fill="#181716"/>
        <rect width="388" height="24" rx="10" fill="#121110"/>
        <circle cx="16" cy="12" r="3" fill="#EE5A2A"/>
        <circle cx="28" cy="12" r="3" fill="#D6F75A"/>
        <circle cx="40" cy="12" r="3" fill="#0DA868"/>
        <text x="56" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7E7A73">Button.tokens.ts</text>

        <text x="16" y="45" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#D6F75A">export const buttonVariants = cva("rounded-lg px-4 font-semibold", {</text>
        <text x="16" y="65" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FAF8F5">  variants: { tone: { primary: "bg-ink text-white", accent: "bg-coral" } },</text>
        <text x="16" y="85" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#EE5A2A">  defaultVariants: { tone: "primary" }</text>
        <text x="16" y="105" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#7E7A73">}); // Auto-generated from token studio</text>
      </g>
    </g>
  </g>
</svg>
