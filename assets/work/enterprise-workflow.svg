<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EFE9"/>
      <stop offset="100%" stop-color="#E5E1D8"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF8F5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#141312" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bg-grad-1)"/>
  
  <!-- Subtle Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141312" stroke-width="1" stroke-opacity="0.035"/>
  </pattern>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Main Dashboard Window -->
  <g transform="translate(60, 45)" filter="url(#shadow)">
    <!-- Browser/App Frame -->
    <rect width="680" height="410" rx="16" fill="url(#card-grad)" stroke="#141312" stroke-opacity="0.08" stroke-width="1.5"/>
    
    <!-- App Header Bar -->
    <rect width="680" height="46" rx="16" fill="#FFFFFF"/>
    <path d="M 0 46 L 680 46" stroke="#141312" stroke-opacity="0.08" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="28" cy="23" r="5" fill="#EE5A2A" fill-opacity="0.8"/>
    <circle cx="44" cy="23" r="5" fill="#D6F75A" stroke="#141312" stroke-opacity="0.2"/>
    <circle cx="60" cy="23" r="5" fill="#0DA868" fill-opacity="0.8"/>

    <!-- Search/Nav Pill -->
    <rect x="90" y="12" width="220" height="22" rx="11" fill="#F7F5F0" stroke="#141312" stroke-opacity="0.06"/>
    <text x="106" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#7E7A73">Search workflow pipeline...</text>
    
    <!-- Header Right Badges -->
    <rect x="530" y="12" width="120" height="22" rx="6" fill="#FDF0EB" stroke="#F9CAB8" stroke-width="1"/>
    <text x="548" y="27" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#EE5A2A">70% LATENCY REDUCTION</text>

    <!-- Sidebar -->
    <rect x="0" y="46" width="160" height="364" fill="#F7F5F0" fill-opacity="0.6"/>
    <path d="M 160 46 L 160 410" stroke="#141312" stroke-opacity="0.06"/>

    <rect x="18" y="66" width="124" height="28" rx="8" fill="#FFFFFF" stroke="#141312" stroke-opacity="0.06"/>
    <rect x="28" y="76" width="8" height="8" rx="2" fill="#EE5A2A"/>
    <text x="44" y="84" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#141312">Operations Hub</text>

    <rect x="18" y="104" width="124" height="24" rx="6" fill="transparent"/>
    <rect x="28" y="112" width="8" height="8" rx="2" fill="#A8A49D"/>
    <text x="44" y="120" font-family="-apple-system, sans-serif" font-size="11" fill="#4E4B46">Workflows (12)</text>

    <rect x="18" y="136" width="124" height="24" rx="6" fill="transparent"/>
    <rect x="28" y="144" width="8" height="8" rx="2" fill="#A8A49D"/>
    <text x="44" y="152" font-family="-apple-system, sans-serif" font-size="11" fill="#4E4B46">Automation Rules</text>

    <rect x="18" y="168" width="124" height="24" rx="6" fill="transparent"/>
    <rect x="28" y="176" width="8" height="8" rx="2" fill="#A8A49D"/>
    <text x="44" y="184" font-family="-apple-system, sans-serif" font-size="11" fill="#4E4B46">Audit Logs</text>

    <!-- Main Content Area: Kanban & Metric Cards -->
    <!-- KPI Cards Row -->
    <g transform="translate(180, 66)">
      <!-- KPI 1 -->
      <rect width="150" height="74" rx="10" fill="#FFFFFF" stroke="#141312" stroke-opacity="0.06"/>
      <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#7E7A73">REPLACED SPREADSHEETS</text>
      <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#141312">12 → 1</text>
      <text x="76" y="52" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#0DA868">Unified</text>

      <!-- KPI 2 -->
      <rect x="162" width="150" height="74" rx="10" fill="#FFFFFF" stroke="#141312" stroke-opacity="0.06"/>
      <text x="176" y="24" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#7E7A73">HOURS SAVED / WK</text>
      <text x="176" y="52" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#EE5A2A">30+ hrs</text>

      <!-- KPI 3 -->
      <rect x="324" width="156" height="74" rx="10" fill="#FFFFFF" stroke="#141312" stroke-opacity="0.06"/>
      <text x="338" y="24" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#7E7A73">SPEED TO SHIP</text>
      <text x="338" y="52" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#141312">8 Weeks</text>
      <text x="424" y="52" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#0DA868">Prod</text>
    </g>

    <!-- Workflow Table / Kanban Columns -->
    <g transform="translate(180, 160)">
      <!-- Table Container -->
      <rect width="480" height="225" rx="10" fill="#FFFFFF" stroke="#141312" stroke-opacity="0.06"/>
      
      <!-- Table Header -->
      <rect width="480" height="32" rx="10" fill="#FAF8F5"/>
      <path d="M 0 32 L 480 32" stroke="#141312" stroke-opacity="0.06"/>
      <text x="16" y="21" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#4E4B46">WORKFLOW MODULE</text>
      <text x="180" y="21" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#4E4B46">STATUS</text>
      <text x="290" y="21" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#4E4B46">AUTOMATION TRIGGER</text>
      <text x="420" y="21" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#4E4B46">SLA</text>

      <!-- Row 1 -->
      <path d="M 0 76 L 480 76" stroke="#141312" stroke-opacity="0.04"/>
      <text x="16" y="58" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#141312">Order Intake &amp; Validation</text>
      <rect x="180" y="47" width="62" height="18" rx="9" fill="#E7F8F0"/>
      <text x="192" y="60" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#0DA868">ACTIVE</text>
      <text x="290" y="58" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7E7A73">ERP Webhook → Sync</text>
      <text x="420" y="58" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#141312">&lt; 120ms</text>

      <!-- Row 2 -->
      <path d="M 0 120 L 480 120" stroke="#141312" stroke-opacity="0.04"/>
      <text x="16" y="102" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#141312">Inventory Allocation Engine</text>
      <rect x="180" y="91" width="70" height="18" rx="9" fill="#E7F8F0"/>
      <text x="190" y="104" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#0DA868">RESOLVED</text>
      <text x="290" y="102" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7E7A73">Realtime Multi-Warehouse</text>
      <text x="420" y="102" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#141312">&lt; 85ms</text>

      <!-- Row 3 -->
      <path d="M 0 164 L 480 164" stroke="#141312" stroke-opacity="0.04"/>
      <text x="16" y="146" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#141312">Finance Reconciliation Suite</text>
      <rect x="180" y="135" width="74" height="18" rx="9" fill="#FDF0EB"/>
      <text x="190" y="148" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#EE5A2A">SYNCHED</text>
      <text x="290" y="146" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7E7A73">Ledger Diff Auto-Fix</text>
      <text x="420" y="146" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#141312">&lt; 210ms</text>

      <!-- Row 4 -->
      <text x="16" y="190" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#141312">Vendor SLA Compliance Monitor</text>
      <rect x="180" y="179" width="62" height="18" rx="9" fill="#E7F8F0"/>
      <text x="192" y="192" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#0DA868">ACTIVE</text>
      <text x="290" y="190" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7E7A73">Automated Alerts → Slack</text>
      <text x="420" y="190" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#141312">Live</text>
    </g>
  </g>
</svg>
