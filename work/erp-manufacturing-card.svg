<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="g_erp-manufacturing-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="glow_erp-manufacturing-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#g_erp-manufacturing-card)"/>
  <circle cx="950" cy="200" r="320" fill="#38BDF8" fill-opacity="0.12"/>
  <circle cx="250" cy="550" r="260" fill="#0EA5E9" fill-opacity="0.08"/>
  
  <!-- Subtle Grid -->
  <pattern id="grid_erp-manufacturing-card" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.04"/>
  </pattern>
  <rect width="1200" height="750" fill="url(#grid_erp-manufacturing-card)"/>

  <!-- Main Mockup Window -->
  <g transform="translate(100, 80)" filter="url(#glow_erp-manufacturing-card)">
    <rect width="1000" height="590" rx="20" fill="#12161F" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="1000" height="56" rx="20" fill="#181E29"/>
    <path d="M 0 56 L 1000 56" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="36" cy="28" r="6" fill="#EF4444"/>
    <circle cx="56" cy="28" r="6" fill="#F59E0B"/>
    <circle cx="76" cy="28" r="6" fill="#10B981"/>
    
    <!-- Badge -->
    <rect x="110" y="15" width="200" height="26" rx="13" fill="#0F131C" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="130" y="32" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">DASHBOARD & OPERATIONS</text>

    <rect x="780" y="15" width="180" height="26" rx="13" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-opacity="0.4"/>
    <text x="804" y="32" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">NIHARROUT.COM</text>

    <!-- Content Area -->
    <g transform="translate(50, 90)">
      <rect x="0" y="0" width="120" height="26" rx="13" fill="#38BDF8" fill-opacity="0.2"/>
      <text x="16" y="17" font-family="monospace" font-size="11" font-weight="700" fill="#38BDF8">CASE STUDY</text>
      
      <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">Custom ERP for Manufacturing Operations</text>
      <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94A3B8">End-to-End Enterprise System of Record</text>

      <!-- Mockup UI Elements / Dashboard Preview -->
      <g transform="translate(0, 140)">
        <rect width="280" height="280" rx="14" fill="#181F2B" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <text x="20" y="36" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Core Architecture</text>
        <rect x="20" y="56" width="240" height="44" rx="8" fill="#0F141D"/>
        <text x="34" y="82" font-family="monospace" font-size="11" fill="#38BDF8">✓ Zero Data Silos</text>
        
        <rect x="20" y="110" width="240" height="44" rx="8" fill="#0F141D"/>
        <text x="34" y="136" font-family="monospace" font-size="11" fill="#10B981">✓ Role-Based Access</text>

        <rect x="20" y="164" width="240" height="44" rx="8" fill="#0F141D"/>
        <text x="34" y="190" font-family="monospace" font-size="11" fill="#FFFFFF">✓ 100% Real-Time Sync</text>

        <rect x="20" y="218" width="240" height="44" rx="8" fill="#38BDF8" fill-opacity="0.15"/>
        <text x="34" y="244" font-family="monospace" font-size="11" font-weight="700" fill="#38BDF8">✓ Shipped by Creuto</text>

        <!-- Right Side Big Graphic Panel -->
        <rect x="305" y="0" width="595" height="280" rx="14" fill="#181F2B" stroke="#FFFFFF" stroke-opacity="0.08"/>
        
        <rect x="330" y="25" width="545" height="60" rx="10" fill="#0F141D"/>
        <circle cx="360" cy="55" r="16" fill="#38BDF8" fill-opacity="0.2"/>
        <circle cx="360" cy="55" r="8" fill="#38BDF8"/>
        <text x="395" y="52" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Custom ERP for Manufacturing Operations</text>
        <text x="395" y="70" font-family="monospace" font-size="11" fill="#64748B">Production Case Study UI Walkthrough</text>

        <!-- Metrics Row -->
        <g transform="translate(330, 105)">
          <rect width="170" height="145" rx="10" fill="#0F141D"/>
          <text x="20" y="32" font-family="monospace" font-size="10" fill="#64748B">STATUS</text>
          <text x="20" y="66" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#10B981">Live</text>
          <text x="20" y="100" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">In Production</text>
          <rect x="20" y="116" width="130" height="6" rx="3" fill="#10B981" fill-opacity="0.4"/>

          <rect x="185" width="170" height="145" rx="10" fill="#0F141D"/>
          <text x="20" y="32" font-family="monospace" font-size="10" fill="#64748B">DELIVERY</text>
          <text x="20" y="66" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#38BDF8">100%</text>
          <text x="20" y="100" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">On Schedule</text>
          <rect x="20" y="116" width="130" height="6" rx="3" fill="#38BDF8" fill-opacity="0.4"/>

          <rect x="370" width="175" height="145" rx="10" fill="#0F141D"/>
          <text x="20" y="32" font-family="monospace" font-size="10" fill="#64748B">ENGINEERING</text>
          <text x="20" y="66" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Creuto</text>
          <text x="20" y="100" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">Dedicated Team</text>
          <rect x="20" y="116" width="135" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.3"/>
        </g>
      </g>
    </g>
  </g>
</svg>